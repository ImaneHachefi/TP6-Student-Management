services:
  mysql:
    image: mysql:8.0
    container_name: studentdb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: studentdb
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - studentdb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  studentdb_data:
